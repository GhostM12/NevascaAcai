<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nevasca Açaí | Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>PAINEL <span>ADMIN</span></h1></header>

<div class="admin-box">
    <h3>🚀 Promoção do Dia (Destaque)</h3>
    <div class="form-group">
        <input type="text" id="promoNome" placeholder="Nome da Promoção">
        <input type="text" id="promoPreco" placeholder="Preço (ex: 19.90)">
        <input type="text" id="promoImg" placeholder="URL da Imagem da Promoção">
        <button class="btn-save" id="btnSalvarPromo">ATUALIZAR DESTAQUE</button>
    </div>

    <h3 style="margin-top: 40px;">🔥 Segunda Promoção (Extra)</h3>
    <div class="form-group">
        <input type="text" id="promoNome2" placeholder="Nome da Promoção 2">
        <input type="text" id="promoPreco2" placeholder="Preço (ex: 15.00)">
        <input type="text" id="promoImg2" placeholder="URL da Imagem da Promoção 2">
        <button class="btn-save" id="btnSalvarPromo2" style="background: #ff00ea;">ATUALIZAR PROMO 2</button>
    </div>

    <h3 style="margin-top: 40px;">➕ Adicionar Novo Produto</h3>
    <div class="form-group">
        <input type="text" id="n" placeholder="Nome do Produto">
        <input type="text" id="p" placeholder="Preço">
        <input type="number" id="q" placeholder="Estoque">
        <input type="text" id="i" placeholder="URL da Imagem">
        <button class="btn-save" id="btnSalvar" style="background: #25d366; color: white;">SALVAR PRODUTO</button>
    </div>

    <h3 style="margin-top: 40px;">📋 Produtos Cadastrados</h3>
    <div id="listaAdmin">Carregando produtos...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, setDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDdgT50VAOkLWpDrbBJm_dLdfsehkSJBE", projectId: "zaptishopwhats" };
    const db = getFirestore(initializeApp(firebaseConfig));
    const colRef = collection(db, "produtos");

    document.getElementById('btnSalvarPromo').onclick = async () => {
        await setDoc(doc(db, "config", "promocao_dia"), {
            nome: document.getElementById('promoNome').value,
            preco: document.getElementById('promoPreco').value,
            img: document.getElementById('promoImg').value
        });
        alert("Promoção atualizada!");
    };

    // Lógica da Segunda Promoção (ADICIONADA)
    document.getElementById('btnSalvarPromo2').onclick = async () => {
        await setDoc(doc(db, "config", "promocao_extra"), {
            nome: document.getElementById('promoNome2').value,
            preco: document.getElementById('promoPreco2').value,
            img: document.getElementById('promoImg2').value
        });
        alert("Segunda promoção atualizada!");
    };

    document.getElementById('btnSalvar').onclick = async () => {
        await addDoc(colRef, { 
            nome: document.getElementById('n').value,
            preco: document.getElementById('p').value,
            estoque: parseInt(document.getElementById('q').value) || 0,
            img: document.getElementById('i').value 
        });
        alert("Produto adicionado!");
    };

    window.alterarPreco = async (id) => {
        const novoPreco = document.getElementById(`input_preco_${id}`).value;
        if (!novoPreco) return alert("Digite o novo valor!");
        await updateDoc(doc(db, "produtos", id), { preco: novoPreco });
        alert("Preço atualizado!");
    };

    window.apagar = async (id) => {
        if(confirm("Tem certeza que deseja excluir?")) await deleteDoc(doc(db, "produtos", id));
    };

    onSnapshot(colRef, (snap) => {
        const lista = document.getElementById('listaAdmin');
        lista.innerHTML = "";
        snap.forEach(d => {
            const p = d.data();
            lista.innerHTML += `
                <div style="background: #2d004d; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; align-items: center; gap: 10px; color: white; border: 1px solid #4b0082;">
                    <span style="flex-grow: 1;">${p.nome} - <strong>R$ ${p.preco}</strong></span>
                    <input type="text" id="input_preco_${d.id}" placeholder="Novo R$" style="width: 80px; padding: 5px;">
                    <button onclick="alterarPreco('${d.id}')" style="background:#00f2ff; border:none; padding:5px 10px; cursor:pointer;">Atualizar</button>
                    <button onclick="apagar('${d.id}')" style="background:red; color:white; border:none; padding:5px 10px; cursor:pointer;">X</button>
                </div>`;
        });
    });
</script>
</body>
</html>
