<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Açaí Nevasca</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .banner-container {
            text-align: center;
            margin: 20px auto;
            max-width: 90%;
        }
        .banner-image {
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        .btn-banner-whatsapp {
            display: inline-block;
            background-color: #25d366;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            font-family: sans-serif;
            margin-bottom: 30px;
            transition: transform 0.2s;
        }
        .btn-banner-whatsapp:hover {
            transform: scale(1.05);
            background-color: #128c7e;
        }
    </style>
</head>
<body>

<button id="btnCompartilhar" onclick="abrirPopupQR()">Compartilhar</button>

<header>
    <h1>Açaí<span> Nevasca</span></h1>
    <div class="header-info">
        <p>📍 Uberlândia-MG</p>
        <p>⚡ Delivery + Rápido da Região</p>
        <p> Estamos no Ifood "Pede um Ifood já"</p>
        <p> Entrega Grátis + Cupom de desconto</p>
    </div>
</header>

<!-- Seção de Banners Promocionais -->
<div class="banner-container">
    <img src="imagen1.jpg" alt="Super Promoção de Inverno" class="banner-image">
    <br>
    <a href="https://wa.me/5534998745318?text=Olá! Vi a promoção de inverno de 70% e gostaria de fazer um pedido." target="_blank" class="btn-banner-whatsapp">PEDIR PELO WHATSAPP</a>
</div>

<div class="banner-container">
    <img src="imagen2.jpg" alt="Promoção Monte seu Açaí" class="banner-image">
    <br>
    <a href="https://wa.me/5534998745318?text=Olá! Quero aproveitar a promoção do Copo de Açaí com 6 adicionais por R$33,00." target="_blank" class="btn-banner-whatsapp">PEDIR PELO WHATSAPP</a>
</div>

<div class="banner-container">
    <img src="imagen3.jpg" alt="Combos de Açaí" class="banner-image">
    <br>
    <a href="https://wa.me/5534998745318?text=Olá! Gostaria de pedir um dos Combos de 500ml." target="_blank" class="btn-banner-whatsapp">PEDIR PELO WHATSAPP</a>
</div>

<div id="promoBarra" onclick="abrirModal(document.getElementById('promoTexto').innerText, document.getElementById('promoValor').innerText)">
    <img id="promoFoto" src="">
    <div>🔥 DESTAQUE: <span id="promoTexto"></span> - R$ <span id="promoValor"></span></div>
</div>

<div id="promoBarra2" class="promo-extra" onclick="abrirModal(document.getElementById('promoTexto2').innerText, document.getElementById('promoValor2').innerText)">
    <img id="promoFoto2" src="">
    <div>✨ EXTRA: <span id="promoTexto2"></span> - R$ <span id="promoValor2"></span></div>
</div>

<div class="search-wrapper">
    <div class="search-box"><input type="text" id="campoBusca" placeholder="🔍 Buscar sabor..." onkeyup="filtrar()"></div>
</div>

<main class="container" id="vitrine"></main>

<div id="modalCheckout" class="modal">
    <div class="modal-content">
        <h2>Finalizar Pedido</h2>
        <input type="text" id="cNome" placeholder="Seu Nome">
        <input type="text" id="cEnd" placeholder="Endereço de Entrega">
        <input type="text" id="cNum" placeholder="Número da casa">
        <input type="text" id="cTel" placeholder="Seu Telefone">
        <div class="modal-buttons">
            <button onclick="document.getElementById('modalCheckout').style.display='none'" class="btn-cancelar">Cancelar</button>
            <button onclick="confirmarPedido()" class="btn-confirmar">CONFIRMAR</button>
        </div>
    </div>
</div>

<div id="popupQR" class="modal">
    <div class="modal-content" style="text-align: center;">
        <h2>Compartilhar</h2>
        <img src="qrcode.png" style="width: 200px; height: 200px; margin: 15px auto; display: block; border: 2px solid #00f2ff; border-radius: 10px;">
        <button onclick="document.getElementById('popupQR').style.display='none'" class="btn-cancelar">Fechar</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCfQW5GoQGPLUYhHPNM2gJYNO7kZbyV9k",
        authDomain: "zaptishopwhats-c6927.firebaseapp.com",
        projectId: "zaptishopwhats-c6927",
        storageBucket: "zaptishopwhats-c6927.firebasestorage.app",
        messagingSenderId: "860482604045",
        appId: "1:860482604045:web:9d400799d1903f7ab09944",
        measurementId: "G-P3CYL2CQFC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let todos = [];
    let produtoAtual = { nome: "", preco: "" };

    window.abrirModal = (nome, preco) => {
        produtoAtual = { nome, preco };
        document.getElementById('modalCheckout').style.display = 'flex';
    };

    window.abrirPopupQR = () => {
        document.getElementById('popupQR').style.display = 'flex';
    };

    window.confirmarPedido = () => {
        const nome = document.getElementById('cNome').value;
        const end = document.getElementById('cEnd').value;
        const num = document.getElementById('cNum').value;
        const tel = document.getElementById('cTel').value;
        if(!nome || !end || !tel) return alert("Por favor, preencha todos os campos!");
        const cod = Math.floor(Math.random() * 9000 + 1000);
        const textoMensagem = `*PEDIDO #${cod}*\n\n*Item:* ${produtoAtual.nome}\n*Valor:* R$ ${produtoAtual.preco}\n\n*DADOS DE ENTREGA*\n*Nome:* ${nome}\n*Endereço:* ${end}, ${num}\n*Telefone:* ${tel}`;
        const url = `https://wa.me/5534998745318?text=${encodeURIComponent(textoMensagem)}`;
        window.open(url, '_blank');
        document.getElementById('modalCheckout').style.display = 'none';
    };

    const render = (lista) => {
        const vitrine = document.getElementById('vitrine');
        vitrine.innerHTML = lista.map(p => `
            <div class="product-card">
                <img class="product-image" src="${p.img || 'https://via.placeholder.com/100'}">
                <div class="product-info">
                    <h3>${p.nome}</h3>
                    <p class="price">R$ ${p.preco}</p>
                    <button class="btn-whatsapp" onclick="abrirModal('${p.nome}', '${p.preco}')">PEDIR AGORA</button>
                </div>
            </div>`).join('');
    };

    window.filtrar = () => {
        const busca = document.getElementById('campoBusca').value.toLowerCase();
        render(todos.filter(p => p.nome.toLowerCase().includes(busca)));
    };

    onSnapshot(collection(db, "produtos"), (snap) => {
        todos = snap.docs.map(d => d.data());
        render(todos);
    });

    (async () => {
        const snap = await getDoc(doc(db, "config", "promocao_dia"));
        if (snap.exists()) {
            const d = snap.data();
            document.getElementById('promoBarra').style.display = 'flex';
            document.getElementById('promoTexto').innerText = d.nome;
            document.getElementById('promoValor').innerText = d.preco;
            document.getElementById('promoFoto').src = d.img || '';
        }

        const snap2 = await getDoc(doc(db, "config", "promocao_extra"));
        if (snap2.exists()) {
            const d2 = snap2.data();
            document.getElementById('promoBarra2').style.display = 'flex';
            document.getElementById('promoTexto2').innerText = d2.nome;
            document.getElementById('promoValor2').innerText = d2.preco;
            document.getElementById('promoFoto2').src = d2.img || '';
        }
    })();
</script>
</body>
</html>
